<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Terminal window background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#181513"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#382E27" stroke-width="2"/>
  
  <!-- Header bar dots -->
  <circle cx="14" cy="12" r="3.2" fill="#E89C90"/>
  <circle cx="23" cy="12" r="3.2" fill="#EFC777"/>
  <circle cx="32" cy="12" r="3.2" fill="#4ADE80"/>

  <!-- Divider line -->
  <line x1="7" y1="20" x2="57" y2="20" stroke="#2C231E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Neon Terminal Green Glow Filter -->
  <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#22C55E" flood-opacity="0.45"/>
  </filter>

  <!-- Prompt '>' in bright retro terminal green -->
  <path d="M15 31L26 41L15 51" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#green-glow)"/>
  
  <!-- Cursor '_' in bright retro terminal green -->
  <line x1="33" y1="51" x2="49" y2="51" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" filter="url(#green-glow)"/>
</svg>
